{% extends "base.html" %}
{% block title %}Create account — RadarScan{% endblock %}

{% block content %}
<div class="auth-wrap">
  <h1>Get started with RadarScan</h1>
  <p class="subtitle">Create a free account and run your first scan in a couple of minutes.</p>

  <a href="{{ url_for('auth.login_google') }}" class="btn btn-google btn-block">
    Sign up with Google
  </a>

  <div class="auth-divider">or with email</div>

  <form method="POST">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Create account</button>
  </form>

  <div class="auth-footer">
    Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
  </div>
</div>
{% endblock %}
