{% extends "base.html" %}
{% block title %}Log in — RadarScan{% endblock %}

{% block content %}
<div class="auth-wrap">
  <h1>Welcome back</h1>
  <p class="subtitle">Log in to continue scanning from your dashboard.</p>

  <a href="{{ url_for('auth.login_google') }}" class="btn btn-google btn-block">
    Log in with Google
  </a>

  <div class="auth-divider">or with email</div>

  <form method="POST">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>

  <div class="auth-footer">
    New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
  </div>
</div>
{% endblock %}
